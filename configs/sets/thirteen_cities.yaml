# thirteen-city set: thirteen cities on six continents. Track A, morphometric
# only (46 descriptors), blocks refined into comparable sampling units.
set: thirteen_cities
title: "thirteen-city set - thirteen cities on six continents"
descriptors: morphometric46
cities: [A, MAN, AMS, MTL, BCN, RIO, SAO, NBO, CAI, LOS, BOM, TYO, SYD]   # pooling order
cities_dir: ../cities
data_dir: ../../data
output_dir: ../../outputs/thirteen_cities
units:
  refinement: true              # trimming + mega-block tiers 1-3 (docs/method.md)
  refinement_params:
    mega_block_ha: 8.0
    mega_block_bldg: 150
    share_all_roads: 0.20
    split_ds: [3.0, 2.0, 1.5, 1.0]
    target_bldg: 150
    min_patch_bldg: 3
    trim_buffer_m: 30.0
    trim_max_envelope: 0.5
    split_min_gsi: 0.15
    split_max_footprint_m2: 300.0
    partition_seed: 42
model:
  pca_components: 5
  pca_whiten: true
  k_range_city: {from: 5, to: 15}
  k_range_pooled: {from: 5, to: 25}   # 13 cities pooled: the 3-city ceiling of 15 is too low
  min_type_size: 12
  kmeans_n_init: 10
  random_state: 42
  stability_reps: 20
